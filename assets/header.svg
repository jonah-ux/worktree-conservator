<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 510" width="1280" height="510" role="img" aria-labelledby="title desc"><title id="title">Worktree Conservator workflow overview</title><desc id="desc">Keep the work. Retire the worktree.. Inspect Git worktrees, review an exact plan, and preserve eligible source before removal. When the evidence is incomplete or the state changes, keep the worktree.. Python CLI · Explicit plans · Preservation archives · Recovery workflow</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0b1423"/><stop offset="1" stop-color="#0e1b2e"/></linearGradient><pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#21314a"/></pattern></defs><rect width="1280" height="510" rx="20" fill="url(#bg)"/><rect width="1280" height="510" rx="20" fill="url(#grid)" opacity=".38"/><rect x="46" y="42" width="36" height="36" rx="10" fill="#f4ba76" fill-opacity=".12" stroke="#f4ba76" stroke-opacity=".45"/><path d="M56 54 l7 6 -7 6 m11 0 h6" fill="none" stroke="#f4ba76" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="97" y="68" fill="#eef5ff" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="25" font-weight="700">Worktree Conservator</text><text x="1234" text-anchor="end" y="64" fill="#8195b3" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="550">LOCAL FIRST · OPEN SOURCE</text><text x="46" y="146" fill="#f1f6ff" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="42" font-weight="700">Keep the work. Retire the worktree.</text><text x="48" y="185" fill="#b6c5db" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="18" font-weight="400">Inspect Git worktrees, review an exact plan, and preserve eligible source before removal.</text><text x="48" y="212" fill="#b6c5db" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="18" font-weight="400">When the evidence is incomplete or the state changes, keep the worktree.</text><rect x="46" y="258" width="263" height="110" rx="14" fill="#111d30" stroke="#2a3b55"/><rect x="64" y="276" width="7" height="7" rx="2" fill="#f4ba76"/><text x="82" y="285" fill="#edf4ff" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="17" font-weight="650">01 / Inspect</text><text x="64" y="317" fill="#b6c5db" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="14" font-weight="400">Check Git state and identity</text><text x="64" y="340" fill="#b6c5db" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="14" font-weight="400">Protect dirty or uncertain work</text><path d="M317 313 h28 m-8 -6 l8 6 -8 6" fill="none" stroke="#f4ba76" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="355" y="258" width="263" height="110" rx="14" fill="#111d30" stroke="#2a3b55"/><rect x="373" y="276" width="7" height="7" rx="2" fill="#f4ba76"/><text x="391" y="285" fill="#edf4ff" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="17" font-weight="650">02 / Review a plan</text><text x="373" y="317" fill="#b6c5db" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="14" font-weight="400">Exact candidates · plan digest</text><text x="373" y="340" fill="#b6c5db" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="14" font-weight="400">No removal during inspection</text><path d="M626 313 h28 m-8 -6 l8 6 -8 6" fill="none" stroke="#f4ba76" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="664" y="258" width="263" height="110" rx="14" fill="#111d30" stroke="#2a3b55"/><rect x="682" y="276" width="7" height="7" rx="2" fill="#f4ba76"/><text x="700" y="285" fill="#edf4ff" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="17" font-weight="650">03 / Preserve &amp; retire</text><text x="682" y="317" fill="#b6c5db" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="14" font-weight="400">Archive · verify · recheck</text><text x="682" y="340" fill="#b6c5db" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="14" font-weight="400">Non-force Git removal</text><path d="M935 313 h28 m-8 -6 l8 6 -8 6" fill="none" stroke="#f4ba76" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="973" y="258" width="263" height="110" rx="14" fill="#111d30" stroke="#2a3b55"/><rect x="991" y="276" width="7" height="7" rx="2" fill="#f4ba76"/><text x="1009" y="285" fill="#edf4ff" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="17" font-weight="650">04 / Recover</text><text x="991" y="317" fill="#b6c5db" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="14" font-weight="400">Retain a recovery receipt</text><text x="991" y="340" fill="#b6c5db" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="14" font-weight="400">Refuse to overwrite newer work</text><line x1="46" y1="411" x2="1234" y2="411" stroke="#283a54"/><text x="46" y="449" fill="#8fa4bf" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="15" font-weight="400">Python CLI · Explicit plans · Preservation archives · Recovery workflow</text><text x="1234" text-anchor="end" y="449" fill="#f4ba76" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="550">WORKFLOW OVERVIEW</text></svg>