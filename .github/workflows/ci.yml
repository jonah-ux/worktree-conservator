name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Test fixtures
        run: python -m unittest discover -s tests -v
      - name: Build sdist and wheel
        run: |
          python -m pip install build
          python -m build --sdist --wheel
      - name: Verify installed wheel and sdist
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/wtc-wheel"
          "$RUNNER_TEMP/wtc-wheel/bin/python" -m pip install --no-deps dist/worktree_conservator-*.whl
          "$RUNNER_TEMP/wtc-wheel/bin/worktree-conservator" --version
          "$RUNNER_TEMP/wtc-wheel/bin/worktree-conservator" demo --json
          python -m venv "$RUNNER_TEMP/wtc-sdist"
          "$RUNNER_TEMP/wtc-sdist/bin/python" -m pip install --no-deps dist/worktree_conservator-*.tar.gz
          "$RUNNER_TEMP/wtc-sdist/bin/worktree-conservator" --version
          "$RUNNER_TEMP/wtc-sdist/bin/worktree-conservator" demo --json
